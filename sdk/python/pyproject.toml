[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "weavetab-gate"
version = "0.1.0"
description = "Local-first multimodal zero-shot decision engine (text & image -> choices, yes/no, score) without PyTorch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Weavetab", email = "contact@weavetab.dev" },
]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://weavetab.dev"
Repository = "https://github.com/Weavetab/gate"
Issues = "https://github.com/Weavetab/gate/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
