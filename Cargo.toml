[package]
name = "weavetab-gate"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gliclass-rs = "1.0"
