name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  node-sdk:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: sdk/node
        run: |
          npm install
          npm run build
          git checkout -- index.js index.d.ts
          npm test

  python-sdk:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: bash
        run: cp README.md sdk/python/README.md
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: sdk/python
          manylinux: ${{ matrix.os == 'ubuntu-latest' && '2_28' || '' }}
          before-script-linux: yum install -y openssl-devel
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: sdk/python/dist/*.whl
