name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      npm:
        description: "Build & publish npm (@weavetab/gate)"
        type: boolean
        default: true
      pypi:
        description: "Build & publish PyPI (weavetab-gate)"
        type: boolean
        default: true
      crates:
        description: "Publish crates.io (weavetab-gate)"
        type: boolean
        default: true

jobs:
  build-node:
    if: github.event_name == 'push' || inputs.npm == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: sdk/node
        run: |
          npm install
          npx napi build --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: node-bindings-${{ matrix.target }}
          path: sdk/node/*.node

  publish-npm:
    needs: build-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: node-bindings-*
          path: sdk/node
          merge-multiple: true
      - run: cp README.md sdk/node/README.md
      - working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@weavetab/gate@$VER" version >/dev/null 2>&1; then
            echo "@weavetab/gate@$VER already published; skipping"
            exit 0
          fi
          npm publish --access public

  build-python:
    if: github.event_name == 'push' || inputs.pypi == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            manylinux: "2_28"
          - os: macos-latest
            manylinux: ""
          - os: windows-latest
            manylinux: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: bash
        run: cp README.md sdk/python/README.md
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: sdk/python
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: yum install -y openssl-devel
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.os }}
          path: sdk/python/dist/*

  publish-pypi:
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/weavetab-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-crates:
    if: github.event_name == 'push' || inputs.crates == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish"
            exit 0
          fi
          VER=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='weavetab-gate'))")
          if curl -sf -A "weavetab-gate-ci" "https://crates.io/api/v1/crates/weavetab-gate/$VER" | grep -q "\"num\":\"$VER\""; then
            echo "weavetab-gate@$VER already published; skipping"
            exit 0
          fi
          cargo publish -p weavetab-gate --locked
